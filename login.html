<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – Widget Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex items-center justify-center p-4 transition-colors">

    <!-- Theme Toggle (Subtle Top-Right Icon) -->
    <div class="fixed top-4 right-4 z-10">
        <button onclick="toggleTheme()" id="themeToggleBtn" title="Toggle theme" class="p-2 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-500 hover:text-slate-900 dark:hover:text-white shadow-sm transition">
            <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
    </div>

    <!-- Centered Card -->
    <div class="w-full max-w-sm">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-7 sm:p-8 shadow-xl space-y-6">
            
            <!-- Logo & Title -->
            <div class="text-center space-y-1.5">
                <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center mx-auto shadow-md mb-2">
                    <i data-lucide="layers" class="w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Widget Dashboard</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400">Sign in to your account</p>
            </div>

            <!-- Error Banner -->
            <div id="errorBanner" class="hidden p-3 rounded-lg bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-900/50 text-xs text-rose-600 dark:text-rose-400 flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span id="errorMessage">Invalid email or password.</span>
            </div>

            <!-- Login Form -->
            <form onsubmit="handleLogin(event)" class="space-y-4">
                
                <!-- Email Field -->
                <div class="space-y-1 text-left">
                    <label for="email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">Email</label>
                    <input type="email" id="email" required placeholder="admin@company.com" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" />
                </div>

                <!-- Password Field -->
                <div class="space-y-1 text-left">
                    <div class="flex items-center justify-between">
                        <label for="password" class="block text-xs font-semibold text-slate-700 dark:text-slate-300">Password</label>
                        <button type="button" onclick="showForgotPasswordModal()" class="text-[11px] text-blue-600 dark:text-blue-400 hover:underline">Forgot?</button>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg pl-3 pr-9 py-2 text-xs text-slate-900 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" />
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
                            <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center text-xs text-slate-500 dark:text-slate-400">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="rememberMe" checked class="rounded border-slate-300 text-blue-600 focus:ring-0 cursor-pointer" />
                        <span>Remember me</span>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-semibold text-xs transition shadow-sm">
                    Sign In
                </button>
            </form>

            <!-- Clean Quick Demo Selector -->
            <div class="pt-3 border-t border-slate-100 dark:border-slate-800 text-center space-y-1.5">
                <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Demo Quick Login</span>
                <select id="demoSelector" onchange="quickSelect(this.value)" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-600 dark:text-slate-300 focus:outline-none cursor-pointer">
                    <option value="">Select a test role...</option>
                    <option value="admin">Administrator (Admin)</option>
                    <option value="developer">Developer (Nitin)</option>
                    <option value="qa">QA Team</option>
                    <option value="content">Content Team</option>
                    <option value="viewer">Viewer (Read-Only)</option>
                </select>
            </div>

        </div>
    </div>

    <!-- Password Reset Modal -->
    <div id="forgotModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-left">
            <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">
                <h3 class="font-bold text-sm text-slate-900 dark:text-white">Reset Password</h3>
                <button onclick="closeForgotPasswordModal()" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                Passwords are managed centrally by your team administrator. Please contact <strong>admin@company.com</strong> or your administrator to reset your credentials.
            </p>
            <div class="pt-2 flex justify-end">
                <button onclick="closeForgotPasswordModal()" class="px-4 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs">Got it</button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        const DEMO_ACCOUNTS = {
            admin: { email: 'admin@company.com', pass: 'Admin@123' },
            developer: { email: 'nitin@company.com', pass: 'Nitin@123' },
            qa: { email: 'qa@company.com', pass: 'Qa@123' },
            content: { email: 'content@company.com', pass: 'Content@123' },
            viewer: { email: 'viewer@company.com', pass: 'Viewer@123' }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            lucide.createIcons();

            const session = authManager.getCurrentSession();
            if (session && session.user) {
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect') || 'index.html';
                window.location.href = redirect;
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;
            const errorBanner = document.getElementById('errorBanner');
            const errorMsg = document.getElementById('errorMessage');

            const result = authManager.login(email, password, remember);

            if (!result.success) {
                errorMsg.innerText = result.error;
                errorBanner.classList.remove('hidden');
                lucide.createIcons();
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') || 'index.html';
            window.location.href = redirect;
        }

        function quickSelect(role) {
            if (!role || !DEMO_ACCOUNTS[role]) return;
            const acc = DEMO_ACCOUNTS[role];
            document.getElementById('email').value = acc.email;
            document.getElementById('password').value = acc.pass;
            document.getElementById('errorBanner').classList.add('hidden');
            
            // Log in immediately on selection
            const res = authManager.login(acc.email, acc.pass, true);
            if (res.success) {
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect') || 'index.html';
                window.location.href = redirect;
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function showForgotPasswordModal() {
            document.getElementById('forgotModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeForgotPasswordModal() {
            document.getElementById('forgotModal').classList.add('hidden');
        }

        function initTheme() {
            const saved = localStorage.getItem('theme-preference') || 'system';
            applyTheme(saved);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('theme-preference', newTheme);
            applyTheme(newTheme);
        }

        function applyTheme(theme) {
            const root = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            let isDark = false;

            if (theme === 'dark') {
                root.classList.add('dark');
                isDark = true;
            } else if (theme === 'light') {
                root.classList.remove('dark');
                isDark = false;
            } else {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    root.classList.add('dark');
                    isDark = true;
                } else {
                    root.classList.remove('dark');
                    isDark = false;
                }
            }

            if (themeIcon) {
                themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
